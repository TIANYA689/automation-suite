[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captcha-challenge"
version = "0.1.0"
description = "Authorized challenge handoff with binding, expiry, and one-time consumption"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Local workspace" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["captcha_challenge*"]

