name: Release Check

# 只在人工打 tag（v*）后运行：生成只读检查报告，不自动发布任何未知产物。
# 没有 gh release create / upload-release-asset 之类的发布步骤——
# 发布由人工确认后手动执行，这里只回答"这个 tag 的提交是否仍通过公开释放门禁"。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      # `fetch-depth: 0` 是承重的：下面那条全历史泄漏扫描读的是 git 历史，
      # 默认浅克隆（depth=1）只会看到 1 个 commit，扫完照样输出「没有泄漏」——
      # 那不是通过，是没扫。判据的执行面必须真的执行。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 只读检查：确认打 tag 的提交没有混入不该发布的文件、路径或密钥。
      - name: Public release check
        run: python scripts/misc/public_release_check.py

      # 文档交叉引用可达性：确保 tag 提交里的文档引用全部真实存在。
      - name: Cross-reference check
        run: python scripts/misc/check_doc_refs.py

      # 全历史泄漏扫描，并对「身份邮箱」硬拦。
      # 2026-10-17 已把历史的作者/提交者统一为仓库所有者的 GitHub noreply 地址
      # （`--env-filter`），并把提交信息里嵌入的旧邮箱一并掩码（`--msg-filter`）。
      # 现在 `identity_exposed` 为 0，所以这条门禁有实际意义：再有人用真实个人
      # 邮箱提交，打 tag 时会红。
      #
      # 只拦 `identity_email`，不拦其余形态：盘符路径、邮箱、私钥头这些
      # `abs_path_windows` / `email` / `private_key` 命中来自检测器自身的
      # 正则与测试夹具——检测器必然包含它要抓的形态，它们由
      # `public_release_check.py` 的显式豁免表覆盖，不该在这里二次判死。
      #
      # 取舍：本仓是个人仓库，署名统一到所有者。若将来接受外部贡献，
      # 这条要么放宽，要么要求贡献者用 noreply 地址。
      - name: History leak check
        run: python scripts/misc/check_history_leaks.py --fail-on identity_email --json
