name: CI

on:
  push:
  pull_request:
  # 手动触发：仓库新建时 Actions 默认关闭，启用后需要一个不造空提交就能验证的入口。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      # 索引是派生产物（已 gitignore），路由相关检查都依赖它，必须先重建。
      - name: Build routing index
        run: python scripts/automation/build_routing_index.py

      - name: Public release check
        run: python scripts/misc/public_release_check.py

      # cases/ 被 .gitignore 挡住，新克隆里它一个文件都没有，本次只会校验 templates/case/。
      # --expect-cases 0 把「空集」写成断言：将来若有人把 cases/ 纳入版本库，CI 会红，
      # 而不是让这条门禁的含义悄悄改变。
      - name: Case state validation
        run: python scripts/misc/validate_case_states.py --expect-cases 0

      # 作业区索引是派生产物，与各作业的 job.json 必须一致。
      - name: Project workspace check
        run: python scripts/misc/check_projects.py

      - name: Pattern coverage check
        run: python scripts/misc/check_pattern_coverage.py

      - name: Routing drift check
        run: python scripts/misc/check_routing_drift.py

      # 文档真实性六项。它们回答的是不同问题，分开跑以便定位失败。
      - name: Command truth check
        run: python scripts/misc/check_commands.py

      - name: Cross-reference check
        run: python scripts/misc/check_doc_refs.py

      - name: Index completeness check
        run: python scripts/misc/check_index.py

      # 预算度量默认只出 warning（--strict 才会让 warning 失败），
      # 这样"旗舰技能逼近上限"会被看见但不会把 CI 变红。
      - name: Document budget check
        run: python scripts/misc/check_budget.py

      - name: Tool inventory check
        run: python scripts/misc/check_tool_inventory.py

      - name: Findings library validation
        run: python scripts/misc/ai_finding.py validate

      # ai_finding validate 只校验字段形态；这一步回答的是「active 的 finding 有没有
      # 一条可解析的证据、superseded 有没有指向真实技术条目」。判据分三类：本仓库
      # 拥有 / 本地产物（projects、exports 等，合法证据位置）/ 断链，**不要求证据
      # 搬进仓库**。findings.jsonl 缺失/空解析/无 active 会直接红——空集不当通过。
      # 跑 --strict：warning 也升级为失败（当前数据 0 warning，升级是钉住现状）。
      - name: Findings quality check
        run: python scripts/misc/check_kb_quality.py --strict

      - name: Upstream source manifest check
        run: python scripts/misc/check_upstream_sources.py

      # 台账覆盖独立成一步：上一步失败可能只是清单 schema 问题，这一步失败则明确是
      # 「台账点名的仓库没登记进清单」。两条判据分开跑，失败位置才能一眼定位。
      - name: Upstream ledger coverage check
        run: python scripts/misc/check_upstream_sources.py --ledger-only

      - name: Install module test dependencies
        shell: bash
        run: |
          requirements="$(python scripts/misc/run_offline_tests.py --print-requirements)"
          if [ -n "$requirements" ]; then
            python -m pip install $requirements
          fi

      - name: Offline unit tests
        run: python scripts/misc/run_offline_tests.py --strict

      # 路由 MCP 服务器依赖（仅 mcp_server.py 需要）。装不上就直接红，
      # 否则冒烟检查会退回「未安装 → 跳过 → CI 仍绿」的静默退化。
      - name: Install routing MCP dependencies
        run: python -m pip install -r scripts/automation/routing/requirements.txt

      # 真实走一遍 MCP stdio 协议。--require-mcp 让「缺依赖」变成失败而非跳过。
      - name: MCP stdio smoke check
        run: python scripts/misc/mcp_smoke_check.py --require-mcp
